# Backend validation: the API, the ML pipeline, the CLI and the Python SDK.
#
# The full suite is run, including the tests that need the trained artifacts,
# because those artifacts are committed and are what production serves. A
# failure here stops a deployment.

name: backend checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-ops.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          # The CPU wheel is a fraction of the default one and nothing here
          # uses a GPU, which is the same choice the server makes.
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-ops.txt

      - name: Check every module imports
        run: |
          set -euo pipefail
          python -m compileall -q api ml spark ops sdk/python tests
          python -c "import api.main"

      - name: Run the test suite
        env:
          DATABASE_URL: sqlite:///./ci.db
          SESSION_SECRET: ci-secret-not-used-in-production
          EAGER_MODEL_LOAD: "false"
        run: python -m pytest -q

      - name: Refuse to ship a secret
        run: python -m ops.checks.secret_scan
