# Documentation validation.
#
# The site is generated from the Markdown in docs/, so a broken page or a link
# the dashboard points at that no longer exists is a build failure rather than
# something a reader discovers.

name: docs checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ops.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-ops.txt
          pip install pytest

      - name: Build the documentation site
        run: python -m ops.site.build_docs

      - name: Every link in the dashboard resolves to a page
        run: python -m pytest tests/project -q
