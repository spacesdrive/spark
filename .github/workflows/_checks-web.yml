# Dashboard validation: lint, types, tests and a real production build.
#
# The build is part of validation rather than only part of the release, so a
# change that type-checks but cannot be bundled is caught on the pull request.

name: web checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
