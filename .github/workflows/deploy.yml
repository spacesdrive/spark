# Release to production.
#
# Runs only on a push to main, and only after the checks for whatever changed
# have passed. The release path is ops/deploy.sh, the same script a person runs
# by hand, so there is one way to ship and not two.
#
# The origin is a single EC2 instance behind Cloudflare. nginx there serves the
# dashboard, the documentation site and /api from one hostname, which is what
# keeps the session cookie same-site. Cloudflare is the proxy and the cache in
# front of it, so a release ends by purging that cache.

name: Deploy

on:
  push:
    branches:
      - main

# One release at a time, and never cancel one that is part way through: the
# tree on the server would be left half written.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/_checks-backend.yml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/_checks-web.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/_checks-docs.yml

  preflight:
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Is deployment configured
        id: check
        env:
          # Only whether each value is empty is ever read, never the value, so
          # nothing secret reaches an output or the log.
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          SSH_KEY: ${{ secrets.SPARK_SSH_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_NAME_TAG: ${{ vars.SPARK_EC2_NAME_TAG }}
          SECURITY_GROUP_NAME: ${{ vars.SPARK_SECURITY_GROUP_NAME }}
          PUBLIC_HOST: ${{ vars.SPARK_PUBLIC_HOST }}
          DOCS_HOST: ${{ vars.SPARK_DOCS_HOST }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
        run: |
          set -euo pipefail
          missing=()

          # Maps the local name to the name that has to be created under
          # Settings, so the report names what the reader must add rather than
          # an alias that only exists inside this step.
          check() {
            [ -n "${!1:-}" ] || missing+=("$2 $3")
          }
          check ROLE_ARN             secret   AWS_DEPLOY_ROLE_ARN
          check SSH_KEY              secret   SPARK_SSH_KEY
          check CF_TOKEN             secret   CLOUDFLARE_API_TOKEN
          check AWS_REGION           variable AWS_REGION
          check EC2_NAME_TAG         variable SPARK_EC2_NAME_TAG
          check SECURITY_GROUP_NAME  variable SPARK_SECURITY_GROUP_NAME
          check PUBLIC_HOST          variable SPARK_PUBLIC_HOST
          check DOCS_HOST            variable SPARK_DOCS_HOST
          check CLOUDFLARE_ZONE_NAME variable CLOUDFLARE_ZONE_NAME

          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "deployment is configured"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment skipped"
            echo
            echo "The checks passed, but this repository has no deployment"
            echo "configuration yet, so nothing was released. Add the following"
            echo "under Settings, then push again or re-run this workflow."
            echo
            for item in "${missing[@]}"; do
              echo "* \`$item\`"
            done
            echo
            echo "The names map to the real values in"
            echo "[docs/operations/ci.md](../blob/main/docs/operations/ci.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "not configured, skipping the release:"
          for item in "${missing[@]}"; do
            echo "  $item"
          done

  release:
    needs: [changes, preflight, backend, web, docs]
    # `always()` lets the job run when a check was skipped because its area did
    # not change. The explicit tests below are what refuse a failed one, so a
    # broken build can never reach production.
    if: >-
      always()
      && needs.changes.outputs.deployable == 'true'
      && needs.preflight.outputs.configured == 'true'
      && needs.backend.result != 'failure'
      && needs.web.result != 'failure'
      && needs.docs.result != 'failure'
      && needs.backend.result != 'cancelled'
      && needs.web.result != 'cancelled'
      && needs.docs.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.SPARK_PUBLIC_HOST }}
    permissions:
      contents: read
      # Only this job mints an AWS token, and only for the length of the run.
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_NAME_TAG: ${{ vars.SPARK_EC2_NAME_TAG }}
      SECURITY_GROUP_NAME: ${{ vars.SPARK_SECURITY_GROUP_NAME }}
      PUBLIC_HOST: ${{ vars.SPARK_PUBLIC_HOST }}
      DOCS_HOST: ${{ vars.SPARK_DOCS_HOST }}
      CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ops.txt

      - name: Install what the release script needs
        run: |
          set -euo pipefail
          npm ci --prefix web
          python -m pip install --upgrade pip
          pip install -r requirements-ops.txt

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: spark-deploy-${{ github.run_id }}

      - name: Find the origin and its security group
        id: target
        run: |
          set -euo pipefail
          host=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_NAME_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].PublicIpAddress' --output text)
          group=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$SECURITY_GROUP_NAME" \
            --query 'SecurityGroups[].GroupId' --output text)

          if [ -z "$host" ] || [ "$host" = "None" ]; then
            echo "no running instance tagged $EC2_NAME_TAG"; exit 1
          fi
          if [ -z "$group" ] || [ "$group" = "None" ]; then
            echo "no security group named $SECURITY_GROUP_NAME"; exit 1
          fi

          echo "origin $host, security group $group"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "group=$group" >> "$GITHUB_OUTPUT"

      - name: Open SSH to this runner only
        id: opened
        env:
          GROUP: ${{ steps.target.outputs.group }}
        run: |
          set -euo pipefail
          # The security group allows SSH from the maintainer's address and
          # nothing else. A runner has a different address on every run, so it
          # is added for this run and taken away again in the step below, which
          # runs even when the release fails.
          ip=$(curl -fsS --max-time 20 https://checkip.amazonaws.com | tr -d '[:space:]')
          case "$ip" in
            *[!0-9.]* | "") echo "could not read the runner address"; exit 1 ;;
          esac
          aws ec2 authorize-security-group-ingress --group-id "$GROUP" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$ip/32,Description=github-actions-$GITHUB_RUN_ID}]"
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"
          echo "opened 22 for $ip/32"

      - name: Release
        env:
          SPARK_HOST: ${{ steps.target.outputs.host }}
          SSH_KEY: ${{ secrets.SPARK_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/spark-deploy.pem"
          # Written from the environment rather than passed as an argument, so
          # the key never reaches the process list or the log.
          printf '%s' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          SPARK_KEY="$key" bash ops/deploy.sh

      - name: Close SSH again
        if: always() && steps.opened.outputs.cidr != ''
        env:
          GROUP: ${{ steps.target.outputs.group }}
          CIDR: ${{ steps.opened.outputs.cidr }}
        run: |
          set -euo pipefail
          aws ec2 revoke-security-group-ingress --group-id "$GROUP" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$CIDR}]"
          echo "closed 22 for $CIDR"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/spark-deploy.pem"

      - name: Check the dashboard and the API answer
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$PUBLIC_HOST/") || code=000
            body=$(curl -s --max-time 30 "https://$PUBLIC_HOST/api/health" | head -c 400) || body=""
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"status"'; then
              echo "dashboard $code, api reported: $body"
              exit 0
            fi
            echo "attempt $attempt: dashboard $code, api '$body'"
            sleep 10
          done
          echo "the origin did not come back healthy"
          exit 1

      - name: Check the documentation site answers
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOCS_HOST/")
          echo "documentation site $code"
          [ "$code" = "200" ]

      - name: Purge the Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # The zone is looked up by name so no identifier has to be kept in
          # repository configuration.
          zone=$(curl -fsS --max-time 30 \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$CLOUDFLARE_ZONE_NAME" \
            | python -c "import json,sys; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          if [ -z "$zone" ]; then
            echo "zone $CLOUDFLARE_ZONE_NAME not found for this token"
            exit 1
          fi
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
            | python -c "import json,sys; ok=json.load(sys.stdin)['success']; print('cache purged' if ok else 'purge failed'); sys.exit(0 if ok else 1)"
